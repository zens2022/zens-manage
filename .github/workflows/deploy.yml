name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger in GitHub Actions UI (Actions -> Run workflow)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 1. Build stage
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular App
        run: npm run build -- --base-href /zens-manage/

      - name: Copy index.html to 404.html (SPA Fallback)
        run: cp dist/zens-manage/browser/index.html dist/zens-manage/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/zens-manage/browser'

  # 2. Deploy stage (isolated job to ensure artifact upload is confirmed)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
